version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - PORT=4000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=mithril_dev
      - DB_USER=mithril
      - DB_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
      - /app/bin
    depends_on:
      - postgres
      - redis
    networks:
      - mithril-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=mithril_dev
      - POSTGRES_USER=mithril
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - mithril-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mithril-network

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - mithril-network

volumes:
  postgres_data:
  redis_data:

networks:
  mithril-network:
    driver: bridge

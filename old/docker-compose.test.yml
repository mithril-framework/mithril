version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_ENV=testing
      - APP_DEBUG=true
      - PORT=4000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=mithril_test
      - DB_USER=mithril
      - DB_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    networks:
      - mithril-network
    command: ["go", "test", "-v", "./..."]

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=mithril_test
      - POSTGRES_USER=mithril
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - mithril-network

  redis:
    image: redis:7-alpine
    networks:
      - mithril-network

volumes:
  postgres_test_data:

networks:
  mithril-network:
    driver: bridge

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mithril-storage-pvc
  namespace: mithril
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd
---

# CI: run tests and publish Docker image to GHCR on push to main.
# No Kubernetes deploy — use infrastructure/k8s/ manually when you have a cluster.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: "1.25"
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: go test -v ./...

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build CLI
        run: go build -o bin/mithril ./cmd/mithril

      - name: Verify version output
        run: |
          ./bin/mithril --version | grep -q 'mithril 1.0.2 (github.com/mithril-framework/mithril)'
          ./bin/mithril ping | grep -q 'mithril 1.0.2 ping ok'

      - name: Scaffold new project
        run: |
          ./bin/mithril new smoke-test
          test -f smoke-test/main.go
          test -f smoke-test/Makefile
          test -f smoke-test/.env
          test ! -f smoke-test/.env.bak
          test "$(git -C smoke-test branch --show-current)" = "main"
          test ! -f smoke-test/mithril-rev
          test ! -f smoke-test/seed

      - name: Install via go install (end-user path)
        run: |
          GOPROXY=direct go install github.com/mithril-framework/mithril/cmd/mithril@v1.0.2
          "$(go env GOPATH)/bin/mithril" --version | grep -q 'mithril 1.0.2 (github.com/mithril-framework/mithril)'
          "$(go env GOPATH)/bin/mithril" new smoke-install
          test -f smoke-install/main.go

      - name: Note proxy.golang.org @latest (informational)
        run: |
          ver=$(GOPROXY=https://proxy.golang.org go list -m -versions github.com/mithril-framework/mithril 2>/dev/null | awk '{print $NF}')
          echo "proxy.golang.org versions tail: $ver"
          if echo "$ver" | grep -q 'v1.0'; then
            echo "proxy has v1.0.x — @latest should work for users without GOPROXY=direct"
          else
            echo "proxy may still serve v0.1.0 as @latest; install.sh uses GOPROXY=direct"
          fi

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

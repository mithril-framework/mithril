apiVersion: apps/v1
kind: Deployment
metadata:
  name: mithril-app
  namespace: mithril
  labels:
    app: mithril-app
    app.kubernetes.io/name: mithril
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mithril-app
  template:
    metadata:
      labels:
        app: mithril-app
        app.kubernetes.io/name: mithril
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
      - name: mithril-app
        image: mithril-framework/mithril:latest
        ports:
        - containerPort: 4000
        env:
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_USER
          value: "mithril"
        - name: DB_NAME
          value: "mithril_prod"
        - name: REDIS_HOST
          value: "redis-service"
        envFrom:
        - configMapRef:
            name: mithril-config
        - secretRef:
            name: mithril-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /livez
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: app-storage
          mountPath: /app/storage
        - name: app-logs
          mountPath: /app/logs
      volumes:
      - name: app-storage
        persistentVolumeClaim:
          claimName: mithril-storage-pvc
      - name: app-logs
        emptyDir: {}
      imagePullSecrets:
      - name: mithril-registry-secret

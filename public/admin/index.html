<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Administration — Mithril Rev</title>
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>

<div id="loginShell">
  <div class="login-brand"><span>Mithril Rev</span> administration</div>
  <div class="signin-card">
    <h2>Sign in</h2>
    <p class="signin-hint">Use email and password (same as <code>/auth/login</code>) or paste an access token. You need superuser or <code>admin.access</code>.</p>
    <label for="loginEmail">Email</label>
    <input type="email" id="loginEmail" autocomplete="username" />
    <label for="loginPassword">Password</label>
    <input type="password" id="loginPassword" autocomplete="current-password" />
    <div class="signin-actions">
      <button type="button" id="loginBtn" class="btn-signin">Sign in</button>
    </div>
    <p class="signin-divider">or paste token</p>
    <label for="token">Access token</label>
    <input type="password" id="token" autocomplete="off" placeholder="eyJ…" />
    <div class="signin-actions">
      <button type="button" id="saveToken" class="btn-signin">Use token</button>
      <button type="button" id="clearToken" class="btn-muted">Sign out</button>
    </div>
    <p id="sessionStatus"></p>
  </div>
</div>

<div id="adminShell" hidden>
  <div id="header">
    <h1><span>Mithril Rev</span> administration</h1>
    <div id="user-tools">
      WELCOME, <strong id="welcomeName">ADMIN</strong>.
      <span class="sep">&nbsp;</span>
      <a href="/" target="_blank" rel="noopener">VIEW SITE</a>
      <span class="sep">/</span>
      <button type="button" class="linkish" id="headerSignOut">LOG OUT</button>
    </div>
  </div>

  <div id="breadcrumbs">
    <a href="#" id="bcHome">Home</a> <span class="sep">›</span>
    <span id="bcRest"></span>
  </div>

  <div id="container">
    <div id="sidebar">
      <div id="sidebar-search">
        <input type="text" id="sidebarFilter" placeholder="Start typing to filter..." />
      </div>
      <div class="sidebar-section">Authentication and authorization</div>
      <div class="sidebar-item" data-label="permissions">
        <button type="button" class="model-link" data-view="permissions">Permissions</button>
        <button type="button" class="add-link" data-add="permission">Add</button>
      </div>
      <div class="sidebar-item" data-label="roles">
        <button type="button" class="model-link" data-view="roles">Roles</button>
        <button type="button" class="add-link" data-add="role">Add</button>
      </div>
      <div class="sidebar-item" data-label="assign">
        <button type="button" class="model-link" data-view="assign">Assign</button>
      </div>
      <div class="sidebar-section">Models</div>
      <div class="sidebar-item" data-label="users">
        <button type="button" class="model-link" data-view="users">Users</button>
        <button type="button" class="add-link" data-add="user">Add</button>
      </div>
      <div class="sidebar-item" data-label="blogs">
        <button type="button" class="model-link" data-view="blogs">Blogs</button>
        <button type="button" class="add-link" data-add="blog">Add</button>
      </div>
    </div>

    <div id="content"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <span id="modal-title">Add</span>
      <button type="button" class="modal-close" id="modal-close" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button type="button" class="btn-cancel" id="modal-cancel">Cancel</button>
      <button type="button" class="btn-save" id="modal-save">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/admin/admin.js"></script>
</body>
</html>
